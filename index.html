<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>D휴가(문양)</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#1b3a5c" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f7f4ee;
    color: #1a1a1a;
    -webkit-tap-highlight-color: transparent;
  }
  #root { min-height: 100vh; }

  @media (min-width: 640px) {
    body { background: #e7e2d5; }
    #root > div {
      max-width: 525px;
      margin: 0 auto;
      min-height: 100vh;
      box-shadow: 0 0 50px rgba(0,0,0,0.12);
      zoom: 1.4;
    }
  }
  @supports not (zoom: 1) {
    @media (min-width: 640px) {
      #root > div {
        transform: scale(1.4);
        transform-origin: top center;
      }
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    getDoc,
    setDoc,
    query,
    where,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp,
    onSnapshot,
    Timestamp,
    writeBatch,
    runTransaction,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyANZU16NYQVAtqQKfqhjGevBWvjp1jI2gc",
    authDomain: "vacation-test-2fe76.firebaseapp.com",
    projectId: "vacation-test-2fe76",
    storageBucket: "vacation-test-2fe76.firebasestorage.app",
    messagingSenderId: "825858873436",
    appId: "1:825858873436:web:79e99077655f751002ae99"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const COLLECTION = "vacations";
  const DAYS_COLLECTION = "vacation_days"; // 신규: 소속+날짜당 문서 1개로 통합한 구조 (읽기 절감용)
  const APPROVAL_COLLECTION = "approvals";
  const MANAGER_COLLECTION = "managers";
  const QUOTA_COLLECTION = "quotas";
  const LOTTERY_EVENT_COLLECTION = "lottery_events";
  const LOTTERY_ENTRY_COLLECTION = "lottery_entries";
  const HYUCHUNGDANG_COLLECTION = "hyuchungdang_requests";
  const SYSTEM_COLLECTION = "system";

  window.VacationAPI = {
    // branch를 넘기면 그 소속 데이터만 서버에서 걸러서 읽어와요 (안 넘기면 예전처럼 전체 조회)
    async getByDate(dateStr, branch) {
      const constraints = [where("date", "==", dateStr)];
      if (branch) constraints.push(where("branch", "==", branch));
      const q = query(collection(db, COLLECTION), ...constraints);
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async getByRange(startStr, endStr, branch) {
      const constraints = [
        where("date", ">=", startStr),
        where("date", "<=", endStr),
      ];
      if (branch) constraints.push(where("branch", "==", branch));
      const q = query(collection(db, COLLECTION), ...constraints);
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async getAll(branch) {
      if (branch) {
        const q = query(collection(db, COLLECTION), where("branch", "==", branch));
        const snap = await getDocs(q);
        return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      }
      const snap = await getDocs(collection(db, COLLECTION));
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    subscribeRange(startStr, endStr, branch, callback) {
      const constraints = [
        where("date", ">=", startStr),
        where("date", "<=", endStr),
      ];
      if (branch) constraints.push(where("branch", "==", branch));
      const q = query(collection(db, COLLECTION), ...constraints);
      return onSnapshot(
        q,
        (snap) => {
          const records = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          callback(records);
        },
        (err) => {
          console.error("실시간 구독 오류:", err);
        }
      );
    },
    async add(record) {
      const ref = await addDoc(collection(db, COLLECTION), {
        ...record,
        status: record.status || "정상",
        createdAt: record.createdAt || serverTimestamp(),
        updatedAt: serverTimestamp(),
      });
      return ref.id;
    },
    async addOnce(id, record) {
      await setDoc(doc(db, COLLECTION, id), {
        ...record,
        status: record.status || "정상",
        createdAt: record.createdAt || serverTimestamp(),
        updatedAt: serverTimestamp(),
      });
      return id;
    },
    async update(id, patch) {
      await updateDoc(doc(db, COLLECTION, id), {
        ...patch,
        updatedAt: serverTimestamp(),
      });
    },
    async cancel(id) {
      await updateDoc(doc(db, COLLECTION, id), {
        status: "취소됨",
        updatedAt: serverTimestamp(),
      });
    },
    async remove(id) {
      await deleteDoc(doc(db, COLLECTION, id));
    },
    async confirm(id, managerName) {
      await updateDoc(doc(db, COLLECTION, id), {
        confirmedBy: managerName,
        confirmedAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
      });
    },
    async getMine(employeeId) {
      const q = query(collection(db, COLLECTION), where("employeeId", "==", employeeId));
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    // 본인 기록 중 날짜 범위로 좁혀서 조회 - "앞으로 5일 이내" 같은 좁은 확인용으로,
    // 굳이 몇 년치 전체 이력을 다 읽어올 필요 없을 때 이걸 써요
    async getMineByRange(employeeId, fromDate, toDate) {
      const q = query(
        collection(db, COLLECTION),
        where("employeeId", "==", employeeId),
        where("date", ">=", fromDate),
        where("date", "<=", toDate)
      );
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async removeAllForEmployee(employeeId) {
      const q = query(collection(db, COLLECTION), where("employeeId", "==", employeeId));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(doc(db, COLLECTION, d.id))));
      return snap.docs.length;
    },
    async removeAllForBranch(branch) {
      const q = query(collection(db, COLLECTION), where("branch", "==", branch));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(doc(db, COLLECTION, d.id))));
      return snap.docs.length;
    },
    async deleteOlderThan(cutoffDate) {
      const q = query(collection(db, COLLECTION), where("date", "<", cutoffDate));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(doc(db, COLLECTION, d.id))));
      return snap.docs.length;
    },
    async fixAutoConfirmLabel() {
      const q = query(collection(db, COLLECTION), where("confirmedBy", "==", "가져오기(자동확인)"));
      const snap = await getDocs(q);
      await Promise.all(
        snap.docs.map((d) => updateDoc(doc(db, COLLECTION, d.id), { confirmedBy: "확인" }))
      );
      return snap.docs.length;
    },
    timestampFromDate(year, month, day) {
      return Timestamp.fromDate(new Date(year, month - 1, day));
    },
    async bulkImport(records) {
      const chunks = [];
      for (let i = 0; i < records.length; i += 450) {
        chunks.push(records.slice(i, i + 450));
      }
      const ids = [];
      for (const chunk of chunks) {
        const batch = writeBatch(db);
        chunk.forEach((r) => {
          const ref = doc(collection(db, COLLECTION));
          ids.push(ref.id);
          const { status, confirmedBy, ...rest } = r;
          batch.set(ref, {
            ...rest,
            status: status || "정상",
            ...(confirmedBy ? { confirmedBy, confirmedAt: serverTimestamp() } : {}),
            createdAt: r.createdAt || serverTimestamp(),
            updatedAt: serverTimestamp(),
          });
        });
        await batch.commit();
      }
      return ids;
    },
  };

  /* ==================================================================== */
  /* VacationDayAPI - 신규 구조 (실사용 중)                                    */
  /* "직원+날짜당 문서 1개" 대신 "소속+날짜당 문서 1개"로 묶어서,               */
  /* 한 달 달력을 볼 때 200~300개 문서 대신 그 달의 일수(최대 31개)만          */
  /* 읽으면 되도록 구조를 바꿔요. 캐싱이 아니라 데이터 자체를 이렇게 저장하는   */
  /* 거라, 캐싱과 달리 "오래된 정보를 보여줄 위험"이 전혀 없어요 - 항상 정확.   */
  /* ==================================================================== */
  function dayDocId_(branch, dateStr) {
    return `${branch}_${dateStr}`;
  }

  window.VacationDayAPI = {
    // 하루치 기록 전체 (기존 getByDate와 동일한 용도)
    async getByDate(dateStr, branch) {
      const snap = await getDoc(doc(db, DAYS_COLLECTION, dayDocId_(branch, dateStr)));
      if (!snap.exists()) return [];
      const entries = snap.data().entries || {};
      return Object.entries(entries).map(([entryId, e]) => ({ id: entryId, ...e }));
    },

    // 한 달(또는 임의 범위) 전체 - 문서 수가 "일수"만큼이라 기존보다 훨씬 저렴해요.
    // startStr/endStr: "YYYY-MM-DD"
    async getByRange(startStr, endStr, branch) {
      const q = query(
        collection(db, DAYS_COLLECTION),
        where("branch", "==", branch),
        where("date", ">=", startStr),
        where("date", "<=", endStr)
      );
      const snap = await getDocs(q);
      const records = [];
      snap.docs.forEach((d) => {
        const data = d.data();
        const entries = data.entries || {};
        Object.entries(entries).forEach(([entryId, e]) => {
          records.push({ id: entryId, ...e });
        });
      });
      return records;
    },

    // 본인 전체 이력 (날짜 범위 지정 필수) - collectionGroup 색인 없이는 직원 기준 전체조회가
    // 비싸서, 우선 날짜 범위를 받아 getByRange를 재사용해요.
    async getMineByRange(employeeId, branch, fromDate, toDate) {
      const records = await window.VacationDayAPI.getByRange(fromDate, toDate, branch);
      return records.filter((r) => r.employeeId === employeeId);
    },

    // 짝수달 1일 오픈 직후 딱 1시간만 쓰는 실시간 구독 - 날짜별 문서라 스냅샷이 와도
    // 최대 31개 문서만 다시 읽으면 돼서, 예전(직원+날짜별) 구조보다 훨씬 저렴해요.
    subscribeRange(startStr, endStr, branch, callback) {
      const q = query(
        collection(db, DAYS_COLLECTION),
        where("branch", "==", branch),
        where("date", ">=", startStr),
        where("date", "<=", endStr)
      );
      return onSnapshot(
        q,
        (snap) => {
          const records = [];
          snap.docs.forEach((d) => {
            const entries = (d.data() || {}).entries || {};
            Object.entries(entries).forEach(([entryId, e]) => records.push({ id: entryId, ...e }));
          });
          callback(records);
        },
        (err) => console.error("실시간 구독 오류(vacation_days):", err)
      );
    },

    // 새 기록 추가 (본인 신청용) - employeeId당 하루 1건 제한을 트랜잭션으로 안전하게 보장해요.
    // guard(선택): 트랜잭션 안에서 "그 순간의 최신 기록 목록"을 받아 검사하는 함수. 정원 초과 등이면 throw해서 저장을 막아요.
    async addOnce(branch, dateStr, employeeId, record, guard) {
      const ref = doc(db, DAYS_COLLECTION, dayDocId_(branch, dateStr));
      const entryId = `${employeeId}_${dateStr}`; // 직원당 하루 1건 - 기존 문서ID 규칙 그대로 재사용
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        const data = snap.exists() ? snap.data() : { branch, date: dateStr, entries: {} };
        const entries = data.entries || {};
        const existing = entries[entryId];
        if (existing && existing.status !== "취소됨") {
          throw new Error("DUPLICATE_ENTRY");
        }
        // 저장 직전 최종 검증 - 다른 사람이 동시에 신청해도 트랜잭션이 재시도되며 여기서 다시 확인돼요
        if (typeof guard === "function") {
          guard(Object.entries(entries).map(([id, e]) => ({ id, ...e })));
        }
        entries[entryId] = {
          ...record,
          status: record.status || "정상",
          createdAt: Timestamp.now(), // 트랜잭션 안에서는 serverTimestamp()를 못 써서 클라이언트 시각 사용
          updatedAt: Timestamp.now(),
        };
        if (snap.exists()) {
          tx.update(ref, { entries, updatedAt: serverTimestamp() });
        } else {
          tx.set(ref, { branch, date: dateStr, entries, updatedAt: serverTimestamp() });
        }
      });
      return entryId;
    },

    // 새 기록 추가 (관리자 대신기록/배정용, 무작위 ID) - 같은 직원이 하루에 여러 건 가능
    async add(branch, dateStr, record) {
      const ref = doc(db, DAYS_COLLECTION, dayDocId_(branch, dateStr));
      const entryId = doc(collection(db, "_dummy")).id; // Firestore 무작위 ID 생성용 트릭
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        const data = snap.exists() ? snap.data() : { branch, date: dateStr, entries: {} };
        const entries = data.entries || {};
        entries[entryId] = {
          ...record,
          status: record.status || "정상",
          createdAt: Timestamp.now(),
          updatedAt: Timestamp.now(),
        };
        if (snap.exists()) {
          tx.update(ref, { entries, updatedAt: serverTimestamp() });
        } else {
          tx.set(ref, { branch, date: dateStr, entries, updatedAt: serverTimestamp() });
        }
      });
      return entryId;
    },

    // 특정 항목 필드 일부 수정 (순번, 메모, 종류 변경 등)
    async update(branch, dateStr, entryId, patch) {
      const ref = doc(db, DAYS_COLLECTION, dayDocId_(branch, dateStr));
      const fieldPatch = {};
      Object.entries(patch).forEach(([k, v]) => {
        fieldPatch[`entries.${entryId}.${k}`] = v;
      });
      fieldPatch[`entries.${entryId}.updatedAt`] = serverTimestamp();
      fieldPatch.updatedAt = serverTimestamp();
      await updateDoc(ref, fieldPatch);
    },

    async cancel(branch, dateStr, entryId) {
      await window.VacationDayAPI.update(branch, dateStr, entryId, { status: "취소됨" });
    },

    async confirm(branch, dateStr, entryId, managerName) {
      await window.VacationDayAPI.update(branch, dateStr, entryId, {
        confirmedBy: managerName,
        confirmedAt: serverTimestamp(),
      });
    },

    // 완전 삭제 (관리자 전용) - 맵에서 그 항목만 제거
    async remove(branch, dateStr, entryId) {
      const ref = doc(db, DAYS_COLLECTION, dayDocId_(branch, dateStr));
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if (!snap.exists()) return;
        const data = snap.data();
        const entries = { ...(data.entries || {}) };
        delete entries[entryId];
        tx.update(ref, { entries, updatedAt: serverTimestamp() });
      });
    },

    // 마이그레이션 전용: { "2026-08-21": { entryId: {...}, ... }, ... } 형태를 통째로 받아서
    // 날짜별 문서로 한 번에 써요 (기존 vacations 데이터를 옮길 때만 써요, 평소엔 안 씀).
    async bulkSetDays(branch, byDate) {
      const dates = Object.keys(byDate);
      let recordCount = 0;
      const CHUNK = 450; // Firestore 배치 1건당 최대 500 - 여유 두고 450
      for (let i = 0; i < dates.length; i += CHUNK) {
        const chunk = dates.slice(i, i + CHUNK);
        const batch = writeBatch(db);
        chunk.forEach((dateStr) => {
          const entries = byDate[dateStr];
          recordCount += Object.keys(entries).length;
          const ref = doc(db, DAYS_COLLECTION, dayDocId_(branch, dateStr));
          batch.set(ref, { branch, date: dateStr, entries, updatedAt: serverTimestamp() });
        });
        await batch.commit();
      }
      return recordCount;
    },

    // 소속 전체 - 날짜 제한 없이 (백업 등에서 씀, 자주 안 쓰는 무거운 조회예요)
    async getAll(branch) {
      const q = query(collection(db, DAYS_COLLECTION), where("branch", "==", branch));
      const snap = await getDocs(q);
      const records = [];
      snap.docs.forEach((d) => {
        const entries = (d.data() || {}).entries || {};
        Object.entries(entries).forEach(([entryId, e]) => records.push({ id: entryId, ...e }));
      });
      return records;
    },

    // 기준일 이전 날짜 문서를 통째로 삭제 (연 1회 보관기한 정리용) - 예전 구조와 다르게
    // 기록 단위가 아니라 "그 날짜 문서 자체"를 지워요 (그 문서 안 기록이 전부 오래된 것들이니까)
    async deleteOlderThan(cutoffDate) {
      const q = query(collection(db, DAYS_COLLECTION), where("date", "<", cutoffDate));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(doc(db, DAYS_COLLECTION, d.id))));
      return snap.docs.length;
    },

    // 소속 전체 날짜 문서를 통째로 삭제 (관리자 "전체 초기화" 버튼용)
    async removeAllForBranch(branch) {
      const q = query(collection(db, DAYS_COLLECTION), where("branch", "==", branch));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(doc(db, DAYS_COLLECTION, d.id))));
      return snap.docs.length;
    },
  };

  window.ApprovalAPI = {
    async request(record) {
      await setDoc(
        doc(db, APPROVAL_COLLECTION, record.id),
        {
          name: record.name,
          branch: record.branch,
          status: "pending",
          requestedAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        },
        { merge: true }
      );
    },
    async getStatus(id) {
      const snap = await getDoc(doc(db, APPROVAL_COLLECTION, id));
      return snap.exists() ? snap.data() : null;
    },
    async listPending() {
      const q = query(collection(db, APPROVAL_COLLECTION), where("status", "==", "pending"));
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async listApproved() {
      const q = query(collection(db, APPROVAL_COLLECTION), where("status", "==", "approved"));
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async setStatus(id, status) {
      await updateDoc(doc(db, APPROVAL_COLLECTION, id), {
        status,
        updatedAt: serverTimestamp(),
      });
    },
    async reset(id) {
      await deleteDoc(doc(db, APPROVAL_COLLECTION, id));
    },
    async deleteAll() {
      const snap = await getDocs(collection(db, APPROVAL_COLLECTION));
      await Promise.all(snap.docs.map((d) => deleteDoc(doc(db, APPROVAL_COLLECTION, d.id))));
      return snap.docs.length;
    },
  };

  window.ManagerAPI = {
    async list() {
      const snap = await getDocs(collection(db, MANAGER_COLLECTION));
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async add(record) {
      const ref = await addDoc(collection(db, MANAGER_COLLECTION), {
        name: record.name,
        branch: record.branch,
        createdAt: serverTimestamp(),
      });
      return ref.id;
    },
    async remove(id) {
      await deleteDoc(doc(db, MANAGER_COLLECTION, id));
    },
  };

  window.QuotaAPI = {
    async get(employeeId) {
      const snap = await getDoc(doc(db, QUOTA_COLLECTION, employeeId));
      return snap.exists() ? snap.data() : null;
    },
    async setExtra(employeeId, name, branch, extra) {
      await setDoc(
        doc(db, QUOTA_COLLECTION, employeeId),
        { name, branch, extra, updatedAt: serverTimestamp() },
        { merge: true }
      );
    },
    async list() {
      const snap = await getDocs(collection(db, QUOTA_COLLECTION));
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
  };

  window.LotteryAPI = {
    async listEvents() {
      const snap = await getDocs(collection(db, LOTTERY_EVENT_COLLECTION));
      const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      list.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      return list;
    },
    async createEvent(data) {
      const ref = await addDoc(collection(db, LOTTERY_EVENT_COLLECTION), {
        ...data,
        status: "응모중",
        createdAt: serverTimestamp(),
      });
      return ref.id;
    },
    async updateEvent(id, patch) {
      await updateDoc(doc(db, LOTTERY_EVENT_COLLECTION, id), {
        ...patch,
        updatedAt: serverTimestamp(),
      });
    },
    async removeEvent(id) {
      await deleteDoc(doc(db, LOTTERY_EVENT_COLLECTION, id));
    },
    async listEntriesForEvent(eventId) {
      const q = query(collection(db, LOTTERY_ENTRY_COLLECTION), where("eventId", "==", eventId));
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async listMyEntries(employeeId) {
      const q = query(collection(db, LOTTERY_ENTRY_COLLECTION), where("employeeId", "==", employeeId));
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async apply(entryId, entry) {
      await setDoc(doc(db, LOTTERY_ENTRY_COLLECTION, entryId), {
        ...entry,
        result: "대기중",
        appliedAt: serverTimestamp(),
      });
      return entryId;
    },
    async cancelApply(entryId) {
      await deleteDoc(doc(db, LOTTERY_ENTRY_COLLECTION, entryId));
    },
    async updateEntry(entryId, patch) {
      await updateDoc(doc(db, LOTTERY_ENTRY_COLLECTION, entryId), patch);
    },
  };

  window.HyuchungdangAPI = {
    async listAll() {
      const snap = await getDocs(collection(db, HYUCHUNGDANG_COLLECTION));
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    // 소속만 걸러서 조회 - 관리 화면(연간 집계까지 필요해서 날짜로는 못 좁힘)이 다른 소속 데이터까지
    // 같이 읽지 않게 해줘요
    async listAllForBranch(branch) {
      const q = query(collection(db, HYUCHUNGDANG_COLLECTION), where("branch", "==", branch));
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    // 소속+날짜 범위로 좁혀서 조회 - 월별 화면(관리자용)이 전체를 다 읽지 않고 그 달만 읽게 해줘요
    async getByRange(startStr, endStr, branch) {
      const constraints = [
        where("date", ">=", startStr),
        where("date", "<=", endStr),
      ];
      if (branch) constraints.push(where("branch", "==", branch));
      const q = query(collection(db, HYUCHUNGDANG_COLLECTION), ...constraints);
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async listByDate(dateStr, branch) {
      const constraints = [where("date", "==", dateStr)];
      if (branch) constraints.push(where("branch", "==", branch));
      const q = query(collection(db, HYUCHUNGDANG_COLLECTION), ...constraints);
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async listMine(employeeId) {
      const q = query(collection(db, HYUCHUNGDANG_COLLECTION), where("employeeId", "==", employeeId));
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    // 오늘 이후(미래) 기록만 좁혀서 조회 - 로그인 시 자동 알림 체크처럼 과거 이력이 필요 없을 때 써요
    async listMineFrom(employeeId, fromDateExclusive) {
      const q = query(
        collection(db, HYUCHUNGDANG_COLLECTION),
        where("employeeId", "==", employeeId),
        where("date", ">", fromDateExclusive)
      );
      const snap = await getDocs(q);
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },
    async request(id, data) {
      await setDoc(doc(db, HYUCHUNGDANG_COLLECTION, id), {
        ...data,
        status: "신청중",
        requestedAt: serverTimestamp(),
      });
      return id;
    },
    async cancel(id) {
      await updateDoc(doc(db, HYUCHUNGDANG_COLLECTION, id), {
        status: "취소됨",
        updatedAt: serverTimestamp(),
      });
    },
    async update(id, patch) {
      await updateDoc(doc(db, HYUCHUNGDANG_COLLECTION, id), {
        ...patch,
        updatedAt: serverTimestamp(),
      });
    },
    async remove(id) {
      await deleteDoc(doc(db, HYUCHUNGDANG_COLLECTION, id));
    },
    async deleteOlderThan(cutoffDate) {
      const q = query(collection(db, HYUCHUNGDANG_COLLECTION), where("date", "<", cutoffDate));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(doc(db, HYUCHUNGDANG_COLLECTION, d.id))));
      return snap.docs.length;
    },
    async removeAllForBranch(branch) {
      const q = query(collection(db, HYUCHUNGDANG_COLLECTION), where("branch", "==", branch));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(doc(db, HYUCHUNGDANG_COLLECTION, d.id))));
      return snap.docs.length;
    },
  };

  // 자동 백업(주 1회) 관련 - 마지막 백업 시각을 저장/조회
  window.SystemAPI = {
    // 교번 변경 예약 목록 - 문서 1개(system/roster_changes)에 배열로 저장해요 (앱 켤 때 읽기 1회)
    async getRosterChanges() {
      const snap = await getDoc(doc(db, SYSTEM_COLLECTION, "roster_changes"));
      return snap.exists() ? (snap.data().items || []) : [];
    },
    async saveRosterChanges(items) {
      await setDoc(doc(db, SYSTEM_COLLECTION, "roster_changes"), {
        items,
        updatedAt: serverTimestamp(),
      });
    },
    async getBackupMeta() {
      const snap = await getDoc(doc(db, SYSTEM_COLLECTION, "backup_meta"));
      return snap.exists() ? snap.data() : null;
    },
    async markBackupDone() {
      await setDoc(
        doc(db, SYSTEM_COLLECTION, "backup_meta"),
        { lastBackupAt: serverTimestamp() },
        { merge: true }
      );
    },
  };

  // 다른 브라우저 로그인용 - PIN을 그대로 저장하지 않고 변형(해시)된 값만 저장/대조해요
  window.AuthAPI = {
    async setPinHash(id, pinHash) {
      await setDoc(
        doc(db, APPROVAL_COLLECTION, id),
        { pinHash },
        { merge: true }
      );
    },
    async getPinHash(id) {
      const snap = await getDoc(doc(db, APPROVAL_COLLECTION, id));
      return snap.exists() ? snap.data().pinHash || null : null;
    },
  };

  window.__firestoreReady = true;
  window.dispatchEvent(new Event("firestore-ready"));
</script>
